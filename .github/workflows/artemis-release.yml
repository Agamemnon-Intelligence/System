name: Artemis release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build Artemis-1.0.exe
        run: bun desktop/build.js bun-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Artemis ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/Artemis-1.0.exe
          body: |
            **Artemis 1.0**: Athene Softworks'ün sıfırdan eğittiği ilk yapay zekâ modeli (8,5 milyon parametre, Türkçe ve İngilizce).

            ### Windows
            1. `Artemis-1.0.exe` dosyasını indirin ve çalıştırın.
            2. Artemis tarayıcınızda açılır. Her şey bilgisayarınızda çalışır, internet gerekmez.
            3. Kapatmak için açılan komut penceresini kapatın.

            Windows SmartScreen "tanınmayan uygulama" uyarısı verirse **Ek bilgi → Yine de çalıştır**'a tıklayın (exe imzalı değildir).

            Artemis 1.0 küçük bir ilk modeldir ve sık sık hata yapar; yanıtlarına güvenmeyin. Artemis 1.1 Pro ve Plasma 2.0 yakında.
